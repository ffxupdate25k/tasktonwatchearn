<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TON Views</title>

<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="app">

<div class="top">
<div class="live">● Task in progress</div>
<div class="session">SESSION LIVE</div>
</div>

<div id="taskCard" class="card">

<p class="label">Total Reward</p>
<h1>0.04 <span>TON</span></h1>
<p class="small">0.01 TON per ad · 4 ads</p>

<div class="bar">
<div id="progress" class="fill"></div>
</div>

<div class="head">
<span>Ad Progress</span>
<span id="counter">0/4</span>
</div>

<div class="statusBox">
<div class="dot"></div>
<div>
<b id="title">Ad 1 is ready</b>
<p>Tap below to start</p>
</div>
</div>

<button id="watchBtn">
▶ Watch Ad 1 of 4
</button>

<div class="reward">+0.01 TON</div>

</div>

<div id="successCard" class="card success">

<div class="check">✓</div>

<h2>Reward Confirmed</h2>

<p>All 4 ads watched and verified</p>

<div class="amount">+0.04 TON</div>

<div class="tags">
<span>Verified</span>
<span>Instant</span>
<span>On-chain</span>
</div>

</div>

</div>

<script src="//libtl.com/sdk.js"
data-zone="11702925"
data-sdk="show_11702925"></script>

<script src="script.js"></script>

</body>
  </html>
