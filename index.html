<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TON Views</title>

  <link rel="stylesheet" href="style.css">

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="container">

  <div class="top">
    <span class="live">● Task in progress</span>
    <span class="session">SESSION LIVE</span>
  </div>

  <!-- TASK CARD -->
  <div id="taskCard" class="card">

    <div class="gem">💠</div>

    <p class="label">Total Reward</p>

    <h1>0.012 <span>TON</span></h1>

    <p class="sub">0.002 TON per ad • 4 ads</p>

    <div class="progressBar">
      <div id="progress" class="progress"></div>
    </div>

    <div class="row">
      <b>Ad Progress</b>
      <span id="counter">0/4</span>
    </div>

    <div class="statusBox">
      <div class="dot"></div>

      <div>
        <b id="title">Ad 1 is ready</b>
        <p>Tap the button to start</p>
      </div>
    </div>

    <button id="watchBtn">
      ▶ Watch Ad 1 of 4
    </button>

    <div class="reward">+0.002 TON</div>

  </div>

  <!-- SUCCESS CARD -->
  <div id="successCard" class="card success">

    <div class="tick">✓</div>

    <h2>Reward Confirmed</h2>

    <p>All 4 ads watched and verified.</p>

    <div class="big">+0.008 TON</div>

    <div class="tags">
      <span>Verified</span>
      <span>Instant</span>
      <span>On-chain</span>
    </div>

  </div>

</div>

<!-- Monetag SDK -->
<script src="//libtl.com/sdk.js"
        data-zone="11702925"
        data-sdk="show_11702925"></script>

<script src="script.js"></script>

</body>
  </html>
